[project]
name = "moss-inference-audit"
version = "0.1.0"
description = "Reproducible audit of Moss Inference: Inference API latency/quality/contract and Tasks API limits"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "jsonschema>=4.23",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
sdk = ["moss==1.26.0", "openai>=1.60"]
report = ["matplotlib>=3.9", "numpy>=2.0"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["PYI034"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["paid: calls the real Moss API and spends credits (skipped unless MOSS_PAID_TESTS=1)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mossaudit"]
